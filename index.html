<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Der Käsefluch - Battlerap Timeline</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 60px;
            animation: fadeIn 0.8s ease-in;
        }

        .header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .timeline {
            position: relative;
            padding: 20px 0;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 100%;
            background: rgba(255, 255, 255, 0.3);
            top: 0;
        }

        .timeline-item {
            margin-bottom: 50px;
            animation: slideIn 0.6s ease-out forwards;
            opacity: 0;
        }

        .timeline-item:nth-child(1) { animation-delay: 0.1s; }
        .timeline-item:nth-child(2) { animation-delay: 0.2s; }

        .timeline-item:nth-child(odd) .content {
            margin-left: 0;
            margin-right: 52%;
            text-align: right;
        }

        .timeline-item:nth-child(even) .content {
            margin-left: 52%;
            margin-right: 0;
            text-align: left;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 16px;
            background: white;
            border: 4px solid #667eea;
            border-radius: 50%;
            top: 20px;
            z-index: 1;
        }

        .content {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .content:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .content.current {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: 2px solid white;
        }

        .content.origin-item {
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
            border: 2px solid #f59e0b;
            margin-left: 0 !important;
            margin-right: 0 !important;
            text-align: left !important;
        }

        .mc-names {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 15px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .timeline-item:nth-child(odd) .mc-names {
            flex-direction: row-reverse;
        }

        .mc {
            background: #667eea;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.95em;
        }

        .content.current .mc {
            background: rgba(255, 255, 255, 0.3);
        }

        .arrow {
            font-size: 1.5em;
            opacity: 0.7;
        }

        .date {
            font-size: 0.85em;
            color: #999;
            margin-bottom: 8px;
        }

        .content.current .date {
            color: rgba(255, 255, 255, 0.8);
        }

        .timestamp {
            display: inline-block;
            background: #f0f0f0;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.85em;
            margin-bottom: 10px;
        }

        .content.current .timestamp {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .video-link {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 16px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 0.9em;
            transition: background 0.3s ease;
        }

        .video-link:hover {
            background: #764ba2;
        }

        .content.current .video-link {
            background: rgba(255, 255, 255, 0.3);
        }

        .thumbnail {
            width: 100%;
            max-width: 300px;
            height: 170px;
            background: #e0e0e0;
            border-radius: 8px;
            margin-top: 12px;
            overflow: hidden;
            object-fit: cover;
        }

        .label {
            display: inline-block;
            background: #764ba2;
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.75em;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .video-container {
            width: 100%;
            margin-top: 15px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .video-container iframe {
            display: block;
            border: none;
        }

        .origin-passes {
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f59e0b;
        }

        .origin-passes h4 {
            color: #d97706;
            margin-bottom: 12px;
            font-size: 1em;
        }

        .origin-pass-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0 8px 10px;
            font-size: 0.95em;
            border-bottom: 1px solid #fef3c7;
            border-left: 4px solid transparent;
            transition: background-color 0.3s;
        }

        .origin-pass-item:last-child {
            border-bottom: none;
        }

        .pass-time {
            font-weight: bold;
            color: #d97706;
            min-width: 60px;
        }

        .pass-names {
            flex: 1;
            color: #333;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .pass-mc-img {
            width: 40px;
            height: 40px;
            border-radius: 4px;
            object-fit: cover;
        }

        .pass-arrow {
            color: #667eea;
            font-weight: bold;
        }

        .wiki-link {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s;
        }

        .wiki-link:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        .pass-link {
            color: #667eea;
            text-decoration: none;
            font-size: 1.1em;
            transition: color 0.3s;
        }

        .pass-link:hover {
            color: #764ba2;
        }

        .content.origin-item h3 {
            color: #d97706;
            margin: 10px 0;
        }

        .content.origin-item .label {
            background: #f59e0b;
            margin-bottom: 15px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .current-badge {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #f5576c;
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4); }
            50% { box-shadow: 0 4px 25px rgba(245, 87, 108, 0.8); }
        }

        @media (max-width: 768px) {
            .header h1 { font-size: 2em; }
            .timeline::before { left: 20px; }
            .timeline-item::before { left: 20px; }
            .timeline-item:nth-child(odd) .content,
            .timeline-item:nth-child(even) .content {
                margin-left: 60px;
                margin-right: 0;
                text-align: left;
            }
            .timeline-item:nth-child(odd) .mc-names { flex-direction: row; }
            .current-badge { top: 10px; right: 10px; padding: 8px 16px; font-size: 0.9em; }
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.2em;
        }

        .error {
            text-align: center;
            color: #ff6b6b;
            background: white;
            padding: 20px;
            border-radius: 12px;
            max-width: 500px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <div class="current-badge" id="currentBadge">Aktuell verflucht: Rias030</div>

    <div class="container">
        <div class="header">
            <h1>Der Käsefluch</h1>
            <p>Battlerap Timeline</p>
        </div>

        <div class="timeline" id="timeline">
            <div class="loading">Wird geladen...</div>
        </div>
    </div>

    <script>
        function getYouTubeEmbedUrl(url) {
            const videoId = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([^&\n?#]+)/);
            return videoId ? `https://www.youtube.com/embed/${videoId[1]}?rel=0` : null;
        }

        function timeToSeconds(timeStr) {
            const parts = timeStr.split(':').map(Number);
            if (parts.length === 2) {
                return parts[0] * 60 + parts[1];
            } else if (parts.length === 3) {
                return parts[0] * 3600 + parts[1] * 60 + parts[2];
            }
            return 0;
        }

        function getMCImage(mcName) {
            const imageMap = {
                'Jamaika Klaus': 'images/Klaus.png',
                'Şer': 'images/Ser.png',
                'Stylz': 'images/Stylz.png',
                'Jilly': 'images/Jilly.png',
                'Bault': 'images/Bault.png',
                'Broody': 'images/Broody.png',
                'Mechthild': 'images/Mechthild.png',
                'Tarek': 'images/Tarek.png',
                'PapaTR': 'images/PapaTR.png',
                'Burst': 'images/Burst.png',
                'Ezra': 'images/Ezra.png',
                'Rias030': 'images/Rias030.PNG',
                'Coccodinho': 'images/Coccodinho.PNG',
                'Niza': 'images/Niza.PNG',
                'Milo': 'images/Milo.PNG'
            };
            return imageMap[mcName] || 'images/placeholder.png';
        }

        function renderTimeline(data) {
            const reversedData = [...data].reverse();
            const timeline = document.getElementById('timeline');
            timeline.innerHTML = '';

            reversedData.forEach((item, index) => {
                const isCurrentYear = index === 0 && !item.origin;
                const itemDiv = document.createElement('div');
                itemDiv.className = `timeline-item ${isCurrentYear ? 'current' : ''}`;

                if (item.origin) {
                    // Render Origin Item with internal passes
                    const embedUrl = getYouTubeEmbedUrl(item.videoLink);
                    let embedHTML = '';
                    if (embedUrl) {
                        embedHTML = `
                            <div class="video-container">
                                <iframe width="100%" height="315" src="${embedUrl}" title="${item.title}" 
                                    frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                    allowfullscreen></iframe>
                            </div>
                        `;
                    }

                    let passesHTML = '';
                    if (item.internalPasses && item.internalPasses.length > 0) {
                        const reversedPasses = [...item.internalPasses].reverse();
                        const passesContent = reversedPasses.map((pass, idx) => {
                            const timestampSeconds = timeToSeconds(pass.timestamp);
                            const videoUrl = item.videoLink.includes('?') 
                                ? `${item.videoLink}&t=${timestampSeconds}`
                                : `${item.videoLink}?t=${timestampSeconds}`;
                            const isFirst = idx === 0;
                            const isLast = idx === reversedPasses.length - 1;
                            const bgColor = isFirst ? '#d1fae5' : isLast ? '#dcfce7' : 'transparent';
                            const borderColor = isFirst ? '#10b981' : isLast ? '#84cc16' : 'transparent';
                            return `
                            <div class="origin-pass-item" style="background-color: ${bgColor}; border-left-color: ${borderColor};">
                                <span class="pass-time">⏱️ ${pass.timestamp}</span>
                                <span class="pass-names">
                                    <img src="${getMCImage(pass.from)}" alt="${pass.from}" class="pass-mc-img">
                                    ${pass.from}
                                </span>
                                <span class="pass-arrow">→</span>
                                <span class="pass-names">
                                    <img src="${getMCImage(pass.to)}" alt="${pass.to}" class="pass-mc-img">
                                    ${pass.to}
                                </span>
                                <a href="${videoUrl}" target="_blank" class="pass-link">🔗</a>
                            </div>
                        `;
                        }).join('');
                        passesHTML = `
                            <div class="origin-passes">
                                <h4>📹 Übergaben im Video</h4>
                                ${passesContent}
                            </div>
                        `;
                    }

                    itemDiv.innerHTML = `
                        <div class="content origin-item">
                            <span class="label">⭐ Käsefluch ⭐</span>
                            ${passesHTML}
                            <h3>${item.title}</h3>
                            <div class="date">${new Date(item.date).toLocaleDateString('de-DE', { year: 'numeric', month: 'long', day: 'numeric' })}</div>
                            ${item.description ? `<p style="margin: 10px 0; font-size: 0.95em; color: #333;">${item.description}</p>` : ''}
                            ${embedHTML}
                        </div>
                    `;
                } else {
                    // Regular timeline item
                    let currentLabel = '';
                    if (isCurrentYear) {
                        currentLabel = '<span class="label">🔥 AKTUELL 🔥</span>';
                    }

                    let thumbnailHTML = '';
                    if (item.thumbnail) {
                        thumbnailHTML = `<img src="${item.thumbnail}" alt="Thumbnail" class="thumbnail">`;
                    }

                    itemDiv.innerHTML = `
                        <div class="content ${isCurrentYear ? 'current' : ''}">
                            ${currentLabel}
                            <div class="date">${new Date(item.date).toLocaleDateString('de-DE', { year: 'numeric', month: 'long', day: 'numeric' })}</div>
                            <div class="mc-names">
                                <span class="mc">${item.from}</span>
                                <span class="arrow">→</span>
                                <span class="mc">${item.to}</span>
                            </div>
                            ${item.timestamp ? `<div class="timestamp">⏱️ ${item.timestamp}</div>` : ''}
                            <a href="${item.videoLink}" target="_blank" class="video-link">🎥 Zum Video</a>
                            ${thumbnailHTML}
                        </div>
                    `;
                }

                timeline.appendChild(itemDiv);
            });

            // Update current badge
            const nonOriginItems = data.filter(item => !item.origin);
            if (nonOriginItems.length > 0) {
                const current = nonOriginItems[nonOriginItems.length - 1];
                document.getElementById('currentBadge').textContent = `🧀 ${current.to} 🧀`;
            }
        }

        async function loadTimeline() {
            try {
                const response = await fetch('data.json');
                if (!response.ok) throw new Error('Konnte data.json nicht laden');
                const data = await response.json();
                renderTimeline(data);
            } catch (error) {
                console.error(error);
                document.getElementById('timeline').innerHTML = `
                    <div class="error">
                        <p>❌ Fehler beim Laden der Daten</p>
                        <p style="font-size: 0.9em; margin-top: 10px;">${error.message}</p>
                    </div>
                `;
            }
        }

        loadTimeline();
    </script>
</body>
</html>
